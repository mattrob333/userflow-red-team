<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-direction:column; gap:6px; width:100%; min-width:0; font-family:'Geist',system-ui,sans-serif;">
  <div style="position:relative; width:100%; aspect-ratio:{{ ratio }}; max-height:{{ maxH }}; margin:0 auto; border-radius:{{ radius }}; overflow:hidden; background:#e9e9e6; border:1px solid rgba(255,255,255,0.12); box-sizing:border-box; max-width:{{ maxW }};">
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; inset:0; display:grid; grid-template-rows:9% 1fr;">
        <div style="background:#ffffff; border-bottom:1px solid #dcdcd8; display:flex; align-items:center; gap:6%; padding:0 3%;">
          <div style="width:9%; height:34%; background:#1d1d1d; border-radius:2px;"></div>
          <div style="width:8%; height:22%; background:#cfcfca; border-radius:2px;"></div>
          <div style="width:8%; height:22%; background:#cfcfca; border-radius:2px;"></div>
          <div style="margin-left:auto; width:4%; aspect-ratio:1; border-radius:50%; background:#cfcfca;"></div>
        </div>
        <div style="display:grid; grid-template-columns:18% 1fr;">
          <div style="background:#f5f5f3; border-right:1px solid #dcdcd8; padding:10% 12%; display:flex; flex-direction:column; gap:9%;">
            <div style="height:5px; background:#cfcfca; border-radius:2px; width:80%;"></div><div style="height:5px; background:#1d1d1d; opacity:.7; border-radius:2px; width:65%;"></div><div style="height:5px; background:#cfcfca; border-radius:2px; width:75%;"></div><div style="height:5px; background:#cfcfca; border-radius:2px; width:55%;"></div>
          </div>
          <div style="padding:5% 6%; display:flex; flex-direction:column; gap:5%;">
            <div style="height:8%; width:45%; background:#1d1d1d; opacity:.82; border-radius:2px;"></div>
            <div style="height:4%; width:70%; background:#c4c4bf; border-radius:2px;"></div>
            <div style="flex:1; background:#fff; border:1px solid #dcdcd8; border-radius:4px; display:flex; flex-direction:column; gap:10%; padding:5%;">
              <div style="height:12%; background:#efefec; border-radius:3px;"></div><div style="height:12%; background:#efefec; border-radius:3px;"></div><div style="height:12%; background:#efefec; border-radius:3px; width:60%;"></div>
            </div>
            <div style="display:flex; gap:3%; justify-content:flex-end;"><div style="height:14px; width:16%; border:1px solid #c4c4bf; border-radius:3px;"></div><div style="height:14px; width:20%; background:{{ ctaColor }}; border-radius:3px;"></div></div>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; background:#fafaf8;">
        <div style="height:7%; background:#fff; border-bottom:1px solid #dcdcd8; display:flex; align-items:center; padding:0 8%; gap:8%;"><div style="width:18%; height:30%; background:#1d1d1d; border-radius:2px;"></div><div style="margin-left:auto; width:8%; aspect-ratio:1; background:#cfcfca; border-radius:50%;"></div></div>
        <div style="padding:8%; display:flex; flex-direction:column; gap:3.5%; flex:1;">
          <div style="height:3%; width:70%; background:#1d1d1d; opacity:.82; border-radius:2px;"></div>
          <div style="height:2%; width:90%; background:#c4c4bf; border-radius:2px;"></div>
          <div style="height:13%; background:#fff; border:1px solid #dcdcd8; border-radius:5px;"></div>
          <div style="height:13%; background:#fff; border:1px solid #dcdcd8; border-radius:5px;"></div>
          <div style="height:13%; background:#fff; border:1px solid #dcdcd8; border-radius:5px;"></div>
          <div style="margin-top:auto; height:5.5%; background:{{ ctaColor }}; border-radius:5px;"></div>
        </div>
        <div style="height:{{ footerH }}; background:#2a2a2a; opacity:{{ footerOp }};"></div>
      </div>
    </sc-if>
    <sc-if value="{{ annotate }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute; left:{{ annX }}%; top:{{ annY }}%; width:{{ annW }}%; height:{{ annH }}%; border:1.5px solid {{ annColor }}; border-radius:3px; box-shadow:0 0 0 3px {{ annGlow }};">
        <div style="position:absolute; left:-1.5px; bottom:100%; margin-bottom:3px; background:{{ annColor }}; color:#fff; font-family:'Geist Mono',monospace; font-size:9px; padding:1px 5px; border-radius:3px; white-space:nowrap;">{{ annLabel }}</div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; justify-content:space-between; gap:8px; font-family:'Geist Mono',monospace; font-size:10px; color:rgba(255,255,255,0.45); min-width:0;">
      <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ caption }}</span><span style="white-space:nowrap;">{{ vpLabel }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:320},&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;annotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;UFR-014&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;EV-028 · /onboarding/4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;red&quot;,&quot;green&quot;],&quot;default&quot;:&quot;red&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;annotation&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{x,y,w,h}&quot;},&quot;footerOverlap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mobileMaxW&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxH&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;tsType&quot;:&quot;string&quot;}}">class Component extends DCLogic {
  renderVals() {
    const p = this.props; const mobile = p.viewport === 'mobile';
    const tone = p.tone || 'red';
    const A = p.annotation || (mobile ? { x: 6, y: 84, w: 88, h: 9 } : { x: 60, y: 83, w: 36, h: 9 });
    return {
      isDesktop: !mobile, isMobile: mobile, ratio: mobile ? '390 / 844' : '16 / 10', radius: mobile ? '14px' : '6px',
      maxW: mobile ? (p.mobileMaxW || '180px') : '100%', maxH: p.maxH || 'none',
      annotate: !!p.annotate, annX: A.x, annY: A.y, annW: A.w, annH: A.h,
      annColor: tone === 'green' ? '#16a34a' : '#dc2626', annGlow: tone === 'green' ? 'rgba(22,163,74,0.18)' : 'rgba(220,38,38,0.16)', annLabel: p.label || '',
      ctaColor: p.ctaColor || '#2b59c3', footerH: p.footerOverlap ? '10%' : '0%', footerOp: p.footerOverlap ? 0.92 : 0,
      hasCaption: !!p.caption, caption: p.caption || '', vpLabel: mobile ? '390×844' : '1440×900',
    };
  }
}</script>
</body>
</html>
